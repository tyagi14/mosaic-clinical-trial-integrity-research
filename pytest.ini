# ============================================================================
# pytest.ini — test runner configuration
#
# RUN THE SUITE:
#   pytest                      all tests
#   pytest -v                   with each test name
#   pytest tests/test_agents.py one file
#   pytest --cov                with a coverage report
# ============================================================================

[pytest]
testpaths = tests

# asyncio_mode = auto means an "async def test_..." runs without needing
# an @pytest.mark.asyncio decorator on every single one.
asyncio_mode = auto

# Each async test gets a fresh event loop. The async stores cache their
# connection pools on the loop that created them, so sharing one loop
# across tests would leak state between them.
asyncio_default_fixture_loop_scope = function

addopts =
    --strict-markers
    --tb=short
    -q
    -p no:logfire
    -p no:pytest_logfire
    # These two pytest plugins ship with the `logfire` package, which is
    # present in this machine's Anaconda environment and is BROKEN there:
    # importing it raises
    #   ImportError: cannot import name '_ExtendedAttributes'
    #            from 'opentelemetry.util.types'
    # because its logfire and opentelemetry versions do not match. pytest
    # auto-loads every installed plugin, so collection failed before a
    # single MOSAIC test ran. Nothing in this project uses logfire, so
    # both plugins are switched off here.
    #
    # Disabling them individually rather than setting
    # PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 keeps pytest-asyncio, which the
    # async tests need.

filterwarnings =
    # The logfire/opentelemetry plugin in this Anaconda environment emits
    # an unrelated import warning on every pydantic import. Silenced so
    # real warnings from our own code stay visible.
    ignore:.*logfire-plugin.*:UserWarning
